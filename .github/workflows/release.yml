name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            archive: BMRCL-Train-Tracker-Windows.zip
          - os: macos-latest
            label: macOS
            archive: BMRCL-Train-Tracker-macOS.zip
          - os: ubuntu-latest
            label: Linux
            archive: BMRCL-Train-Tracker-Linux.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[package]"

      - name: Build executable
        run: python package.py

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/BMRCL-Train-Tracker/* -DestinationPath ${{ matrix.archive }}

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: cd dist/BMRCL-Train-Tracker && zip -r ../../${{ matrix.archive }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
          body: |
            Download the archive for your platform below, unzip it, and run
            the `BMRCL-Train-Tracker` executable inside. Python is not required.

            On macOS, right-click the app and choose Open the first time, since
            the build is unsigned.
